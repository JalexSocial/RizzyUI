name: CI

# Validates every pull request and every push to main. This workflow never publishes anything:
# packages are released by release.yml from a version tag, and the documentation site is deployed
# by docs.yml.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  client:
    name: JS tests, build and drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rizzyui/package-lock.json
            src/RizzyUI/package-lock.json

      - name: Install (packages/rizzyui)
        working-directory: packages/rizzyui
        run: npm ci

      - name: JS unit tests
        working-directory: packages/rizzyui
        run: npm test

      - name: Build client assets
        working-directory: packages/rizzyui
        run: npm run build

      # dist/ and src/RizzyUI/wwwroot are committed and are what the NuGet and npm packages ship
      # (dotnet build does not rebuild them). A fresh build must reproduce them exactly.
      - name: Check committed client assets are up to date
        run: |
          git add -N packages/rizzyui/dist src/RizzyUI/wwwroot
          if ! git diff --exit-code --stat -- packages/rizzyui/dist src/RizzyUI/wwwroot; then
            echo "::error::Committed client assets are out of date. Run 'npm run build' in packages/rizzyui and commit the result."
            exit 1
          fi

      - name: Accessibility inventory tests and check
        working-directory: src/RizzyUI
        run: |
          npm ci
          npm test
          npm run check-accessibility-inventory

  dotnet:
    name: .NET build, test, pack and consumer smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rizzyui/package-lock.json
            src/RizzyUI.Docs/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'src/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The docs project builds its Tailwind CSS during dotnet build.
      - name: Install npm packages
        run: |
          (cd packages/rizzyui && npm ci)
          (cd src/RizzyUI.Docs && npm ci)

      # RizzyUI references RizzyUI.Tasks as a package. Packing it first fails CI on a broken Tasks
      # package and lets a new Tasks version restore before it is published (see release.yml).
      - name: Pack RizzyUI.Tasks
        run: bash eng/pack-tasks.sh ./artifacts/nupkgs

      - name: Restore
        run: dotnet restore src/RizzyUI.sln -p:RestoreAdditionalProjectSources="$PWD/artifacts/nupkgs"

      - name: Build
        run: dotnet build src/RizzyUI.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test src/RizzyUI.sln -c Release --no-build
          --logger "trx;LogFilePrefix=test-results"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      # CI packages get a unique pre-release version so the smoke test can never resolve a
      # published package of the same version.
      - name: Pack
        id: pack
        run: |
          base=$(grep -oPm1 '(?<=<Version>)[^<]+' src/RizzyUI/RizzyUI.csproj)
          version="${base}-ci.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dotnet pack src/RizzyUI/RizzyUI.csproj -c Release --no-build -p:Version="$version" -o ./artifacts/nupkgs
          dotnet pack templates/RizzyUI.Templates.csproj -c Release -p:RizzyUIVersion="$version" -o ./artifacts/nupkgs
          mkdir -p ./artifacts/npm
          (cd packages/rizzyui && npm pkg set version="$version" && npm pack --pack-destination ../../artifacts/npm && git checkout -- package.json)

      - name: Check package contents
        run: python3 eng/check-package-contents.py ./artifacts/nupkgs ./artifacts/npm/*.tgz

      - name: Install Playwright Chromium
        working-directory: src/RizzyUI.Docs
        run: npx playwright install --with-deps chromium

      - name: Consumer smoke test
        run: bash eng/consumer-smoke-test.sh ./artifacts/nupkgs "${{ steps.pack.outputs.version }}" ./artifacts/npm/*.tgz

      # dotnet new rizzyui: generate, build (npm + Tailwind), publish, run and check the starter app
      # against the packages above. The generated app builds outside this repository, with the
      # newest SDK installed here, so .NET 11 is added for the net11.0 variant.
      - name: Setup .NET 11 for the template test
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Template test
        run: bash eng/template-test.sh ./artifacts/nupkgs "${{ steps.pack.outputs.version }}" ./artifacts/npm/*.tgz net10.0 net11.0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-artifacts
          path: artifacts/
          if-no-files-found: warn

  # Summit (samples/Summit): a real MVC application built on RizzyUI, tested end to end in a browser
  # under the standard and the strict-CSP build. See docs/engineering/summit-demo-plan.md.
  summit:
    name: Summit demo app (HTTP and browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rizzyui/package-lock.json
            samples/Summit/src/Summit.Web/package-lock.json
            samples/Summit/tests/e2e/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-summit-${{ hashFiles('**/*.csproj', 'src/Directory.Build.props', 'samples/Summit/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Summit.Web links @jalexsocial/rizzyui from packages/rizzyui (file: dependency).
      - name: Install npm packages and Playwright
        run: |
          (cd packages/rizzyui && npm ci)
          cd samples/Summit/tests/e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Build
        run: |
          bash eng/pack-tasks.sh ./artifacts/nupkgs
          dotnet restore samples/Summit/Summit.slnx -p:RestoreAdditionalProjectSources="$PWD/artifacts/nupkgs"
          dotnet build samples/Summit/Summit.slnx -c Debug --no-restore

      - name: HTTP tests
        run: dotnet test samples/Summit/Summit.slnx -c Debug --no-build --logger "trx;LogFilePrefix=summit" --results-directory ./artifacts/summit-test-results

      # The HTTP tests above use the repository projects (Project mode). The browser tests run against
      # the packed packages, as a consumer installs them (Package mode), so both modes compile on every
      # run and the browser sees exactly what ships.
      - name: Pack RizzyUI (NuGet and npm)
        id: pack
        run: |
          base=$(grep -oPm1 '(?<=<Version>)[^<]+' src/RizzyUI/RizzyUI.csproj)
          version="${base}-ci.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dotnet build src/RizzyUI/RizzyUI.csproj -c Release -p:RestoreAdditionalProjectSources="$PWD/artifacts/nupkgs"
          dotnet pack src/RizzyUI/RizzyUI.csproj -c Release --no-build -p:Version="$version" -o ./artifacts/nupkgs
          mkdir -p ./artifacts/npm
          (cd packages/rizzyui && npm pkg set version="$version" && npm pack --pack-destination ../../artifacts/npm && git checkout -- package.json)

      # Code-behind unit tests against the tarball, publish in Package mode, check the publish output,
      # start two published servers (Production, standard and strict CSP), run Playwright.
      - name: Publish Summit against the packages and run the browser tests (standard, CSP, mobile)
        run: bash eng/summit-test.sh ./artifacts/nupkgs "${{ steps.pack.outputs.version }}" ./artifacts/npm/*.tgz

      - name: Check the build and tests left the working tree clean
        run: |
          git add -N .
          if ! git diff --exit-code --stat; then
            echo "::error::Building or testing Summit changed tracked files (see the list above)."
            exit 1
          fi

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: summit-playwright-output
          path: |
            samples/Summit/tests/e2e/playwright-report/
            samples/Summit/tests/e2e/test-results/
          if-no-files-found: ignore

  browser:
    name: Browser tests (accessibility fixtures and docs integration)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rizzyui/package-lock.json
            src/RizzyUI.Docs/package-lock.json

      - name: Install npm packages and Playwright
        run: |
          (cd packages/rizzyui && npm ci)
          cd src/RizzyUI.Docs
          npm ci
          npx playwright install --with-deps chromium

      # Debug: a Release build of the docs app generates the static site and exits on startup
      # (see the #if !DEBUG block in src/RizzyUI.Docs/Program.cs).
      - name: Build the docs app
        run: |
          bash eng/pack-tasks.sh ./artifacts/nupkgs
          dotnet restore src/RizzyUI.Docs/RizzyUI.Docs.csproj -p:RestoreAdditionalProjectSources="$PWD/artifacts/nupkgs"
          dotnet build src/RizzyUI.Docs/RizzyUI.Docs.csproj -c Debug --no-restore

      # Hand-written fixture pages (keyboard/focus/axe contracts).
      - name: Accessibility fixture tests
        working-directory: src/RizzyUI.Docs
        run: npm run test:a11y

      # The real docs app: server-rendered components, packaged RizzyUI runtime, htmx 4 and Rizzy 6.
      - name: Integration tests (docs app)
        working-directory: src/RizzyUI.Docs
        run: npm run test:integration

      # Building and testing must not change tracked files (RZUI-045, RZUI-046). A change here usually
      # means wwwroot/css/app.css is stale: run `npm run build:css` in src/RizzyUI.Docs and commit it.
      - name: Check the build and tests left the working tree clean
        run: |
          git add -N .
          if ! git diff --exit-code --stat; then
            echo "::error::Building or testing the docs app changed tracked files (see the list above)."
            exit 1
          fi

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: |
            src/RizzyUI.Docs/playwright-report*/
            src/RizzyUI.Docs/test-results*/
          if-no-files-found: ignore

  # Every docs page on both builds: errors, CSP violations, axe (WCAG 2.2 A/AA), duplicate ids and
  # dangling ARIA references. Known defects are listed with their finding in
  # src/RizzyUI.Docs/tests/integration/docs-scan-known.ts; anything else fails. Its own job, in
  # parallel, because it loads about 240 pages. See docs/engineering/summit-remediation-plan.md (W0).
  docs-scan:
    name: Docs scan (every page, accessibility and errors)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rizzyui/package-lock.json
            src/RizzyUI.Docs/package-lock.json

      - name: Install npm packages and Playwright
        run: |
          (cd packages/rizzyui && npm ci)
          cd src/RizzyUI.Docs
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the docs app
        run: |
          bash eng/pack-tasks.sh ./artifacts/nupkgs
          dotnet restore src/RizzyUI.Docs/RizzyUI.Docs.csproj -p:RestoreAdditionalProjectSources="$PWD/artifacts/nupkgs"
          dotnet build src/RizzyUI.Docs/RizzyUI.Docs.csproj -c Debug --no-restore

      - name: Scan every docs page (standard and CSP builds)
        working-directory: src/RizzyUI.Docs
        run: npm run test:docs-scan

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-scan-output
          path: |
            src/RizzyUI.Docs/playwright-report-docs-scan/
            src/RizzyUI.Docs/test-results-docs-scan/
          if-no-files-found: ignore
